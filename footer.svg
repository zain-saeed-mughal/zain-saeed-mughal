<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#0F0C29"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#9D4EDD"/>
    </linearGradient>
  </defs>
  <style>
    .t{font:700 26px "Segoe UI",Ubuntu,Arial,sans-serif;fill:#FFFFFF;animation:pulse 3s ease-in-out infinite}
    .e{font:600 18px Consolas,"Courier New",monospace;fill:#00F5D4}
    @keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
  </style>
  <path fill="url(#bg)" d="M0 40 Q150 10 300 40 T600 40 T900 40 T1200 40 T1500 40 T1800 40 T2100 40 T2400 40 V170 H0 Z">
    <animateTransform attributeName="transform" type="translate" values="0 0;-600 0" dur="8s" repeatCount="indefinite"/>
  </path>
  <path fill="url(#w1)" opacity="0.35" d="M0 30 Q150 55 300 30 T600 30 T900 30 T1200 30 T1500 30 T1800 30 T2100 30 T2400 30 V44 Q2250 70 2100 44 T1800 44 T1500 44 T1200 44 T900 44 T600 44 T300 44 T0 44 Z">
    <animateTransform attributeName="transform" type="translate" values="-600 0;0 0" dur="10s" repeatCount="indefinite"/>
  </path>
  <text class="t" x="600" y="110" text-anchor="middle">Let's build something real</text>
  <text class="e" x="600" y="145" text-anchor="middle">zainsaeedmughal4@gmail.com</text>
</svg>
